name: CI - Universidade Atendimento

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar e testar
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar codigo-fonte
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validar projeto com Maven
        run: mvn --batch-mode --no-transfer-progress verify
