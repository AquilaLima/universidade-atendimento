<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Atendimento</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }

      .login-card {
        background-color: white;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
      }

      .logo {
        text-align: center;
        margin-bottom: 25px;
      }

      .logo h1 {
        margin: 0;
        color: #1f4e79;
        font-size: 28px;
      }

      .logo p {
        margin-top: 8px;
        color: #777;
        font-size: 14px;
      }

      .linha {
        height: 3px;
        width: 60px;
        background-color: #1f4e79;
        margin: 15px auto 25px;
      }

      .campo {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #1f4e79;
        box-shadow: 0 0 3px rgba(31, 78, 121, 0.3);
      }

      .botao {
        width: 100%;
        padding: 12px;
        background-color: #1f4e79;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
      }

      .botao:hover {
        background-color: #163a5c;
      }

      .erro {
        background-color: #f8d7da;
        color: #842029;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
      }

      .rodape {
        text-align: center;
        color: #777;
        font-size: 12px;
        margin-top: 25px;
      }

      @media (max-width: 500px) {
        .login-container {
          padding: 15px;
        }

        .login-card {
          padding: 25px;
        }
      }

      .cadastro-link {
        text-align: center;
        margin-top: 20px;
        color: #666;
        font-size: 14px;
      }

      .cadastro-link a {
        color: #1f4e79;
        font-weight: bold;
        text-decoration: none;
      }

      .cadastro-link a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="logo">
          <h1>Universidade</h1>
          <div class="linha"></div>
          <p> Sistema de Atendimento </p>
        </div>
        <!-- Mensagem de erro -->
        <div class="erro" th:if="${erro}" th:text="${erro}"> E-mail ou senha inválidos </div>
        <!-- Login -->
        <form action="/login" method="post">
          <div class="campo">
            <label for="email"> E-mail </label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="senha"> Senha </label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
          </div>
          <button type="submit" class="botao"> Entrar </button>
          <span>Não possui uma conta?</span>
          <a href="/cadastro"> Criar cadastro </a>
      </div>
      </form>
      <div class="rodape"> Sistema de Atendimento da Universidade </div>
    </div>
    </div>
  </body>
</html>
