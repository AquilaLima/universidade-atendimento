<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema de Atendimento</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background-color: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-card {

            background-color: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;

            color: #1f4e79;

            font-size: 28px;
        }

        .logo p {
            margin-top: 8px;

            color: #777;

            font-size: 14px;
        }

        .linha {
            height: 3px;

            width: 60px;

            background-color: #1f4e79;

            margin: 15px auto 25px;
        }

        .tipo-login {

            display: flex;

            margin-bottom: 25px;

            border: 1px solid #ddd;

            border-radius: 6px;

            overflow: hidden;
        }

        .tipo-login button {

            width: 50%;

            padding: 12px;

            border: none;

            background-color: #f4f6f8;

            color: #555;

            font-weight: bold;

            cursor: pointer;
        }

        .tipo-login button.ativo {

            background-color: #1f4e79;

            color: white;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {

            outline: none;

            border-color: #1f4e79;

            box-shadow: 0 0 3px rgba(31, 78, 121, 0.3);
        }

        .botao {

            width: 100%;

            padding: 12px;

            background-color: #1f4e79;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .botao:hover {
            background-color: #163a5c;
        }

        .erro {

            background-color: #f8d7da;

            color: #842029;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        .informacao {

            background-color: #e7f1ff;

            color: #084298;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            font-size: 13px;

            line-height: 1.5;
        }

        .rodape {

            text-align: center;

            color: #777;

            font-size: 12px;

            margin-top: 25px;
        }

        .oculto {
            display: none;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- =========================
             LOGO
        ========================== -->

        <div class="logo">

            <h1>Universidade</h1>

            <div class="linha"></div>

            <p>Sistema de Atendimento</p>

        </div>

        <!-- =========================
             MENSAGEM DE ERRO
        ========================== -->

        <div
                class="erro"
                th:if="${erro}"
                th:text="${erro}">

            Dados inválidos.

        </div>

        <!-- =========================
             SELEÇÃO DO PERFIL
        ========================== -->

        <div class="tipo-login">

            <button
                    type="button"
                    id="btnAluno"
                    class="ativo"
                    onclick="mostrarAluno()">

                Aluno

            </button>

            <button
                    type="button"
                    id="btnUniversidade"
                    onclick="mostrarUniversidade()">

                Universidade

            </button>

        </div>


        <!-- =====================================================
             LOGIN DO ALUNO
        ====================================================== -->

        <div id="loginAluno">

            <div class="informacao">

                Informe seu e-mail institucional.

                <br>

                Caso seja seu primeiro acesso, você será direcionado
                para concluir seu cadastro.

            </div>

            <form
                    action="/login/aluno"
                    method="post">

                <div class="campo">

                    <label for="emailAluno">
                        E-mail institucional
                    </label>

                    <input
                            type="email"
                            id="emailAluno"
                            name="email"
                            placeholder="exemplo@universidade.edu.br"
                            autocomplete="email"
                            required>

                </div>

                <button
                        type="submit"
                        class="botao">

                    Continuar

                </button>

            </form>

        </div>


        <!-- =====================================================
             LOGIN DA UNIVERSIDADE
        ====================================================== -->

        <div
                id="loginUniversidade"
                class="oculto">

            <div class="informacao">

                Área destinada aos usuários institucionais.

                <br>

                Informe o e-mail e a credencial de acesso.

            </div>

            <form
                    action="/login/universidade"
                    method="post">

                <div class="campo">

                    <label for="emailUniversidade">
                        E-mail
                    </label>

                    <input
                            type="email"
                            id="emailUniversidade"
                            name="email"
                            placeholder="Digite o e-mail institucional"
                            autocomplete="email"
                            required>

                </div>


                <div class="campo">

                    <label for="credencial">
                        Credencial institucional
                    </label>

                    <input
                            type="password"
                            id="credencial"
                            name="credencial"
                            placeholder="Digite a credencial"
                            autocomplete="current-password"
                            required>

                </div>


                <button
                        type="submit"
                        class="botao">

                    Entrar

                </button>

            </form>

        </div>

    </div>


    <div class="rodape">

        Sistema de Atendimento da Universidade

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT PARA ALTERNAR ENTRE ALUNO E UNIVERSIDADE
====================================================== -->

<script>

    function mostrarAluno() {

        document
                .getElementById("loginAluno")
                .classList.remove("oculto");

        document
                .getElementById("loginUniversidade")
                .classList.add("oculto");

        document
                .getElementById("btnAluno")
                .classList.add("ativo");

        document
                .getElementById("btnUniversidade")
                .classList.remove("ativo");
    }


    function mostrarUniversidade() {

        document
                .getElementById("loginUniversidade")
                .classList.remove("oculto");

        document
                .getElementById("loginAluno")
                .classList.add("oculto");

        document
                .getElementById("btnUniversidade")
                .classList.add("ativo");

        document
                .getElementById("btnAluno")
                .classList.remove("ativo");
    }

</script>

</body>

</html>
