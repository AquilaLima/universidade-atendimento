<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Validar código</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
        }

        .erro {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            box-sizing: border-box;
            font-size: 20px;
            text-align: center;
            letter-spacing: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #2f6fed;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            opacity: 0.9;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 18px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Validar acesso</h2>

    <p>
        Digite o código de 6 dígitos enviado para seu e-mail.
    </p>

    <div class="erro"
         th:if="${erro}"
         th:text="${erro}">
    </div>

    <form th:action="@{/login/universidade/codigo}"
          method="post">

        <input
                type="text"
                name="codigo"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

    <a class="voltar"
       th:href="@{/login}">
        Voltar para o login
    </a>

</div>

</body>
</html>
