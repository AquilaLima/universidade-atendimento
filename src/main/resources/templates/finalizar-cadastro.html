<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Cadastro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
        }

        h1 {
            color: #1f4e79;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1f4e79;
            box-shadow: 0 0 3px rgba(31,78,121,0.3);
        }

        input[readonly] {
            background-color: #f2f2f2;
            color: #666;
        }

        .botao {
            width: 100%;
            padding: 12px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao:hover {
            background-color: #163a5c;
        }

        .erro {
            background-color: #f8d7da;
            color: #842029;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
        }

        .rodape {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Finalizar Cadastro</h1>

        <div class="subtitulo">
            Complete seus dados para acessar o sistema.
        </div>

        <div
            class="erro"
            th:if="${erro}"
            th:text="${erro}">
        </div>

        <form action="/finalizar-cadastro" method="post" onsubmit="return validarSenhas()">

            <div class="campo">
                <label for="email">
                    E-mail institucional
                </label>

                <input
                    type="email"
                    id="email"
                    th:value="${usuario.email}"
                    readonly>
            </div>

            <div class="campo">
                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required>
            </div>

            <div class="campo">
                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(11) 99999-9999"
                    required>
            </div>

            <div class="campo">
                <label for="senha">
                    Crie uma senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    minlength="6"
                    required>
            </div>

            <div class="campo">
                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite novamente sua senha"
                    minlength="6"
                    required>
            </div>

            <button
                type="submit"
                class="botao">

                Finalizar Cadastro

            </button>

        </form>

    </div>

    <div class="rodape">
        Sistema de Atendimento da Universidade
    </div>

</div>

<script>
    function validarSenhas() {

        const senha =
            document.getElementById("senha").value;

        const confirmarSenha =
            document.getElementById("confirmarSenha").value;

        if (senha !== confirmarSenha) {

            alert("As senhas não coincidem.");

            return false;
        }

        return true;
    }
</script>

</body>
</html>
