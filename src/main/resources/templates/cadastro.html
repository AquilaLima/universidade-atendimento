<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Universidade</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        /* =========================
           CARD
        ========================= */

        .cadastro-card {

            background: white;

            width: 100%;

            max-width: 450px;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.10);

        }


        /* =========================
           CABEÇALHO
        ========================= */

        .cabecalho {

            text-align: center;

            margin-bottom: 30px;

        }


        .cabecalho h1 {

            margin: 0;

            color: #1f4e79;

            font-size: 28px;

        }


        .subtitulo {

            margin-top: 8px;

            color: #777;

            font-size: 14px;

        }


        /* =========================
           ERRO
        ========================= */

        .erro {

            background: #f8d7da;

            color: #842029;

            border: 1px solid #f5c2c7;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;

        }


        /* =========================
           CAMPOS
        ========================= */

        .campo {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

            font-size: 14px;

        }


        input,
        select {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;

            background: white;

            outline: none;

            transition: border 0.2s;

        }


        input:focus,
        select:focus {

            border-color: #1f4e79;

        }


        /* =========================
           CREDENCIAL
        ========================= */

        #campoCredencial {

            background: #eef3f8;

            border-left: 4px solid #1f4e79;

            padding: 15px;

            border-radius: 6px;

            margin-bottom: 20px;

        }


        #campoCredencial .informacao {

            font-size: 12px;

            color: #666;

            margin-top: 7px;

            line-height: 1.4;

        }


        /* =========================
           BOTÃO
        ========================= */

        button {

            width: 100%;

            padding: 13px;

            background: #1f4e79;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            background: #163a5c;

        }


        /* =========================
           RODAPÉ DO CARD
        ========================= */

        .login-link {

            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #666;

        }


        .login-link a {

            color: #1f4e79;

            font-weight: bold;

            text-decoration: none;

        }


        .login-link a:hover {

            text-decoration: underline;

        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 500px) {

            .cadastro-card {

                padding: 25px;

            }


            .cabecalho h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>


<div class="cadastro-card">


    <!-- =========================
         CABEÇALHO
    ========================= -->

    <div class="cabecalho">

        <h1>Universidade</h1>

        <div class="subtitulo">

            Crie sua conta no sistema de atendimento

        </div>

    </div>


    <!-- =========================
         ERRO
    ========================= -->

    <div class="erro"

         th:if="${erro}"

         th:text="${erro}">

        Erro ao realizar cadastro.

    </div>


    <!-- =========================
         FORMULÁRIO
    ========================= -->

    <form action="/cadastro"
          method="post">


        <!-- NOME -->

        <div class="campo">

            <label for="nome">
                Nome
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                autocomplete="name"
                required>

        </div>


        <!-- E-MAIL -->

        <div class="campo">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required>

        </div>


        <!-- SENHA -->

        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                autocomplete="new-password"
                required>

        </div>


        <!-- PERFIL -->

        <div class="campo">

            <label for="perfil">
                Tipo de acesso
            </label>

            <select
                name="perfil"
                id="perfil"
                onchange="mostrarCredencial()"
                required>

                <option value="ALUNO">
                    Aluno
                </option>

                <option value="UNIVERSIDADE">
                    Universidade
                </option>

            </select>

        </div>


        <!-- CREDENCIAL UNIVERSIDADE -->

        <div id="campoCredencial"
             style="display: none;">

            <label for="credencial">

                Credencial da Universidade

            </label>


            <input
                type="password"
                id="credencial"
                name="credencial"
                placeholder="Digite a credencial">


            <div class="informacao">

                A credencial é necessária para criar
                uma conta com perfil de Universidade.

            </div>

        </div>


        <!-- BOTÃO -->

        <button type="submit">

            Criar Cadastro

        </button>


    </form>


    <!-- =========================
         LOGIN
    ========================= -->

    <div class="login-link">

        Já possui uma conta?

        <a href="/login">

            Fazer login

        </a>

    </div>


</div>


<script>

    function mostrarCredencial() {

        const perfil =
            document.getElementById("perfil").value;

        const campo =
            document.getElementById("campoCredencial");

        const credencial =
            document.getElementById("credencial");


        if (perfil === "UNIVERSIDADE") {

            campo.style.display = "block";

            credencial.required = true;

        } else {

            campo.style.display = "none";

            credencial.required = false;

            credencial.value = "";

        }

    }


    // Executa ao carregar a página
    mostrarCredencial();

</script>


</body>

</html>
